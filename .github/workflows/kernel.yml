name: Build SevconKernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Ветка ядра"
        default: "lineage-24.0"
      ksu:
        description: "Добавить KernelSU"
        type: boolean
        default: true
      ksu_ref:
        description: "Тег/ветка KernelSU (пусто = последний релиз, main = dev)"
        default: ""

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_amlogic_kernel-5.15
  KERNEL_NAME: Sevcon-Kernel
  # build.config.constants в репозитории ядра: CLANG_VERSION=r487747c
  CLANG_VERSION: r487747c

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves lz4 cpio zip rsync \
            curl git python3 xz-utils \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone kernel
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git clone --depth=1 --single-branch -b "$BRANCH" "$KERNEL_REPO" kernel

      - name: Restore clang cache
        uses: actions/cache@v4
        with:
          path: clang
          key: aosp-clang-${{ env.CLANG_VERSION }}

      - name: Toolchain (AOSP clang)
        shell: bash
        run: |
          CLANG_DIR="$GITHUB_WORKSPACE/clang"
          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            ok=""
            for ref in android14-release main; do
              url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${ref}/clang-${CLANG_VERSION}.tar.gz"
              echo "Trying $url"
              rm -rf clang.tmp && mkdir clang.tmp
              if curl -fL --retry 3 "$url" | tar -xz -C clang.tmp; then
                mv clang.tmp "$CLANG_DIR"; ok=1; break
              fi
            done
            if [ -z "$ok" ]; then
              echo "::warning::AOSP clang ${CLANG_VERSION} не скачался, использую clang-17 из apt"
              sudo apt-get install -y --no-install-recommends clang-17 lld-17 llvm-17
              echo "/usr/lib/llvm-17/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          fi
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Integrate KernelSU
        if: ${{ inputs.ksu }}
        working-directory: kernel
        env:
          KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s -- ${KSU_REF}
          ls -la drivers/kernelsu
          git -C KernelSU log -1 --oneline

      - name: Configure and build
        working-directory: kernel
        env:
          WITH_KSU: ${{ inputs.ksu }}
        run: |
          clang --version | head -n1

          export KBUILD_BUILD_USER="$KERNEL_NAME"
          export KBUILD_BUILD_HOST="github-actions"

          MAKE_ARGS=(
            O=out ARCH=arm64 LLVM=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )

          # amlogic_gki_defconfig = gki_defconfig + amlogic_gki.fragment (как в build.config.amlogic)
          KCONFIG_CONFIG=arch/arm64/configs/amlogic_gki_defconfig \
            scripts/kconfig/merge_config.sh -m -r \
              arch/arm64/configs/gki_defconfig \
              arch/arm64/configs/amlogic_gki.fragment
          make "${MAKE_ARGS[@]}" amlogic_gki_defconfig
          rm -f arch/arm64/configs/amlogic_gki_defconfig

          # Имя ядра + KernelSU (хуки через kprobes)
          scripts/config --file out/.config \
            --set-str LOCALVERSION "-${KERNEL_NAME}" -d LOCALVERSION_AUTO
          if [ "$WITH_KSU" = "true" ]; then
            scripts/config --file out/.config -e KPROBES -e KPROBE_EVENTS -e KSU
          fi
          make "${MAKE_ARGS[@]}" olddefconfig

          grep -E '^CONFIG_(LOCALVERSION|KPROBES|KPROBE_EVENTS|KSU)=' out/.config
          if [ "$WITH_KSU" = "true" ]; then
            grep -q '^CONFIG_KSU=y' out/.config || { echo "::error::CONFIG_KSU не включился"; exit 1; }
          fi

          make -j1 "${MAKE_ARGS[@]}" DTC_FLAGS="-@" Image Image.gz dtbs modules

          # build.config.amlogic: Image.lz4 без legacy-флага (-l), иначе u-boot не распакует
          lz4 -f -12 --favor-decSpeed out/arch/arm64/boot/Image out/arch/arm64/boot/Image.lz4

          make "${MAKE_ARGS[@]}" INSTALL_MOD_PATH="$GITHUB_WORKSPACE/dist/modules" INSTALL_MOD_STRIP=1 modules_install

      - name: Collect output
        run: |
          mkdir -p dist/dtbs
          B=kernel/out/arch/arm64/boot
          cp "$B"/Image "$B"/Image.gz "$B"/Image.lz4 dist/
          cp "$B"/dts/amlogic/*.dtb dist/dtbs/
          cp kernel/out/.config dist/config
          cp kernel/out/include/config/kernel.release dist/
          echo "Kernel release: $(cat dist/kernel.release)"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
